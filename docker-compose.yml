services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: leads_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leads_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Loopback only: the default credentials must not be reachable from the LAN.
    ports:
      - "127.0.0.1:5432:5432"

  app:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/leads_db
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-45}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
    # Loopback only: the API has no authentication, so it must not be reachable
    # from the LAN.  n8n reaches it over the Compose network as http://app:8000.
    ports:
      - "127.0.0.1:8000:8000"
    # PID 1 reaps the zombie processes Chromium leaves behind.
    init: true
    # Docker's 64 MB default /dev/shm crashes Chromium on heavier pages.
    shm_size: 1gb
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      # Cookies are only marked Secure over HTTPS; this stack serves plain HTTP on loopback.
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: UTC
    # Loopback only: the n8n editor must not be reachable from the LAN.
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  n8n_data:
